name: AutoRSS Feed Processor

on:
  workflow_dispatch:          # Triggered externally by cron-job.org twice a day
                              # (05:30 & 11:30 UTC = 11:00 & 17:00 IST).
                              # More reliable than GitHub's built-in schedule.

# Never let two runs overlap — protects the posted.json commit-back from racing.
concurrency:
  group: autorss
  cancel-in-progress: false

jobs:
  run-autorss:
    runs-on: ubuntu-latest
    # 35 min ceiling leaves room for the in-job retry loop (up to two 10-min waits) on top
    # of a normal ~1-2 min run.
    timeout-minutes: 35

    # Required so the workflow can commit the updated posted.json back to the repo.
    permissions:
      contents: write

    env:
      RSS_FEEDS:           ${{ secrets.RSS_FEEDS }}
      GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
      SCORING_CRITERIA:    ${{ secrets.SCORING_CRITERIA }}
      POSTING_THRESHOLD:   ${{ secrets.POSTING_THRESHOLD }}
      BUFFER_API_KEY:      ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_IDS:  ${{ secrets.BUFFER_CHANNEL_IDS }}
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Retry the whole run up to 3 times, waiting 10 minutes between attempts, so a
      # transient outage (e.g. Gemini API down → nothing posted) recovers on its own.
      # A normal run succeeds on the first attempt and never sleeps. Dedup (posted.json is
      # written to disk mid-run and re-read on each attempt) prevents double-posting.
      - name: Run AutoRSS script
        run: |
          for attempt in 1 2 3; do
            echo "=== AutoRSS attempt $attempt ==="
            if node index.js; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; waiting 10 minutes before retry..."
              sleep 600
            fi
          done
          echo "All attempts failed."
          exit 1

      - name: Persist posted history
        if: always()
        run: |
          if [[ -n "$(git status --porcelain posted.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add posted.json
            git commit -m "chore: update posted history [skip ci]"
            git push
          else
            echo "No changes to posted.json — nothing to commit."
          fi

      - name: Notify on failure
        if: failure()
        run: |
          MESSAGE="❌ AutoRSS run FAILED on $(date -u '+%Y-%m-%d %H:%M UTC'). Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.TELEGRAM_CHAT_ID }}\",\"text\":\"${MESSAGE}\"}"
